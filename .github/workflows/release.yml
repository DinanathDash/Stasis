name: Build, Release, and Update Homebrew

on:
  push:
    branches:
      - main # Triggers on merge/push to main branch

jobs:
  release:
    name: Build DMG & Update Cask
    runs-on: macos-latest
    permissions:
      contents: write # Needed to push release and commit updates

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to calculate semantic version tags

      - name: Calculate Semantic Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Update Xcode App Version
        run: |
          # The semantic version without 'v' (e.g. 1.0.1)
          APP_VERSION=${{ steps.tag_version.outputs.new_version }}
          
          # Replace MARKETING_VERSION in all targets in the pbxproj
          sed -i '' 's/MARKETING_VERSION = .*/MARKETING_VERSION = '$APP_VERSION';/' stasis.xcodeproj/project.pbxproj

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project stasis.xcodeproj \
            -scheme "stasis-release" \
            -configuration Release \
            -archivePath $PWD/build/Stasis.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Export App
        run: |
          mkdir -p $PWD/build/export
          cp -R $PWD/build/Stasis.xcarchive/Products/Applications/stasis.app $PWD/build/export/Stasis.app

      - name: Install Tools
        run: brew install create-dmg fileicon

      - name: Create DMG
        run: |
          cd build/export
          mkdir -p dmg_root
          cp -R "Stasis.app" dmg_root/
          # 1. Explicitly sign the helper daemon first (it needs its own default requirement, not the main app's)
          codesign --force --sign - "dmg_root/Stasis.app/Contents/Library/LaunchServices/com.dinanathdash.stasis.charging-helper"
          
          # 2. Deep sign the app to recursively sign frameworks/XPCs with their default requirements
          codesign --force --deep --sign - "dmg_root/Stasis.app"
          
          # 3. Create a custom requirement file so that SMAppService can validate the app without a Team ID
          echo 'designated => identifier "com.dinanathdash.stasis"' > req.txt
          
          # 4. Shallow sign the main app bundle to inject the custom requirement, leaving nested items intact
          codesign --force --sign - -r req.txt "dmg_root/Stasis.app"
          create-dmg \
            --volname "Stasis" \
            --volicon "Stasis.app/Contents/Resources/AppIcon.icns" \
            --window-pos 340 200 \
            --window-size 600 400 \
            --icon-size 100 \
            --background "../../assets/dmg-background.png" \
            --icon "Stasis.app" 123 210 \
            --hide-extension "Stasis.app" \
            --app-drop-link 430 220 \
            "../../Stasis.dmg" \
            "dmg_root"
          
          # Set the custom icon on the DMG file itself
          fileicon set "../../Stasis.dmg" "Stasis.app/Contents/Resources/AppIcon.icns"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            Stasis.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256
        id: shasum
        run: |
          echo "sha256=$(shasum -a 256 Stasis.dmg | awk '{print $1}')" >> $GITHUB_ENV
          echo "version=${{ steps.tag_version.outputs.new_version }}" >> $GITHUB_ENV

      - name: Generate Sparkle Appcast
        run: |
          curl -L -o sparkle.zip https://github.com/sparkle-project/Sparkle/releases/download/2.6.2/Sparkle-for-Swift-Package-Manager.zip
          unzip -q sparkle.zip -d sparkle_tools
          mkdir appcast_gen
          cp Stasis.dmg appcast_gen/
          cp appcast.xml appcast_gen/
          echo "${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}" | ./sparkle_tools/bin/generate_appcast --ed-key-file - --download-url-prefix "https://github.com/DinanathDash/Stasis/releases/download/${{ steps.tag_version.outputs.new_tag }}/" appcast_gen
          cp appcast_gen/appcast.xml .

      - name: Update Homebrew Cask and Commit
        run: |
          # Replace version in stasis.rb
          sed -i '' 's/version ".*"/version "'${{ env.version }}'"/' Casks/stasis.rb
          # Replace sha256 in stasis.rb
          sed -i '' 's/sha256 ".*"/sha256 "'${{ env.sha256 }}'"/' Casks/stasis.rb
          
          # Commit the updated ruby file, pbxproj, and appcast.xml to the repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/stasis.rb
          git add stasis.xcodeproj/project.pbxproj
          git add appcast.xml
          git commit -m "chore: bump version to v${{ env.version }}, update Homebrew Cask, and update appcast [skip ci]"
          git push origin main
